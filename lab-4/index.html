<!DOCTYPE html>
<html lang="en">
<head>
		<meta charset="UTF-8">
		<title>Standings</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link href="css/tables.css" rel="stylesheet" />
</head>

<body>
	<header>
		<h1>Eastern</h1>
	</header>
	<main>
        <!-- Table displaying standings -->
		<table>
			<!-- Table title -->
			<caption>Atlantic</caption>
			<thead>
				<tr>
                    <!-- Table header row -->
					<th>Rank</th>
					<th>Team</th>
                    <th>GP</th>
                    <th>W</th>
                    <th>L</th>
                    <th>OT</th>
                    <th>PTS</th>
                    <th>P%</th>
                    <th>RW</th>
                    <th>ROW</th>
                    <th>GF</th>
                    <th>GA</th>
                    <th>DIFF</th>
                    <th>HOME</th>
                    <th>AWAY</th>
                    <th>S/O</th>
                    <th>L10</th>
                    <th>STRK</th>
				</tr>
			</thead>
			<!-- Table body containing team data -->
			<tbody>
                <tr>
                    <td>1</td>
                    <td><strong>Tampa Bay Lightning</strong></td>
                    <td>75</td><td>47</td><td>22</td><td>6</td><td>100</td>
                    <td>.667</td><td>38</td><td>43</td><td>274</td><td>210</td><td class="positive">+64</td>
                    <td>24-13-1</td><td>23-9-5</td><td>4-2</td><td>7-1-2</td><td>W1</td>
                </tr>
			</tbody>
		</table>
	</main>
</body>
</html>
